{% extends "base.html" %}
{% block title %}支出登録 - COSTLY{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-gray-800 mb-6">支出を登録する</h1>

<div class="bg-white rounded-xl shadow p-6">
  <form method="post" action="/expenses/new" class="space-y-5">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">費目</label>
      <input type="text" name="category" required placeholder="例：食費"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">金額（円）</label>
      <input type="number" name="amount" required min="1" placeholder="例：3500"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">日付</label>
      <input type="date" name="date" required value="{{ today }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <button type="submit"
            class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition font-medium">
      登録する
    </button>
  </form>
</div>

<a href="/" class="block mt-4 text-sm text-indigo-600 hover:underline">← ダッシュボードに戻る</a>
{% endblock %}
