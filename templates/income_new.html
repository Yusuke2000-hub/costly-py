{% extends "base.html" %}
{% block title %}収入登録 - COSTLY{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-gray-800 mb-6">収入を登録する</h1>

<div class="bg-white rounded-xl shadow p-6">
  <form method="post" action="/incomes/new" class="space-y-5">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">対象月</label>
      <input type="month" name="month" required value="{{ current_month }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">金額（円）</label>
      <input type="number" name="amount" required min="1" placeholder="例：250000"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
    </div>
    <button type="submit"
            class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition font-medium">
      登録する
    </button>
  </form>
  <p class="text-xs text-gray-400 mt-3">※ 同じ月の収入が既に登録されている場合は上書きします。</p>
</div>

<a href="/" class="block mt-4 text-sm text-indigo-600 hover:underline">← ダッシュボードに戻る</a>
{% endblock %}
